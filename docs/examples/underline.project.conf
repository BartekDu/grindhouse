# .claude/grind/project.conf — Underline
#
# The law bundle (scripts/grind/*) is project-AGNOSTIC since the project.conf
# layer landed; everything Underline-specific that used to be hardcoded in
# value-gate / hygiene-check / landable-guard lives here now. Copy this file to
# <underline-repo>/.claude/grind/project.conf (commit it — it is shared config,
# not a secret) and the bundle behaves exactly as it did before the layer.

# Campaign branches are cut from + PR'd back to dev (CLAUDE.md §11).
GRIND_BASE_BRANCH="dev"

# landable-guard refuses direct pushes to these (PRs only).
GRIND_PROTECTED_BRANCHES="dev main"

# Underline scratch noise re-asserted by every window (self-heal — see
# hygiene-check header for the rebase-loses-uncommitted-.gitignore incident).
GRIND_EXTRA_IGNORES="db.sqlite3 graphify-out/cache/ graphify-out/cost.json graphify-out/.graphify_*"

# Underline backlog ids the generic value-gate patterns don't already cover
# (generic covers: #N, GH/ISSUE/PR N, ABC-123 Jira-style — that matches T24-3,
# SEC-12, LP-4, R-007 — TODO-x, T-NN, and semi-grind's CF/TC/DD/RULE ids).
# E-series ids have no dash (E7), LP sometimes drops it (LP3) — cover them here:
GRIND_VALUE_EXTRA_RE='\bE[0-9]+\b|\bLP[0-9]+\b'

# Verification gates: put one command per line into
# <underline-repo>/.claude/grind/verify-cmds, e.g.
#   yarn typecheck
#   yarn lint
#   yarn jest --forceExit
#   python3 manage.py check
# (verify-run runs them in order; without the file it auto-detects by project type.)
